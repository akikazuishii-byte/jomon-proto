<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縄文の海 3D地図（試作）</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* カラーのレギュレーション（BASE・KEY・SUB・FONT）
     BASE 生成りの紙 #F4EEDF／KEY 藍 #1B4F66／SUB 土 #8A6A44／FONT 墨 #1F2A2E
     しるしの色：旧石器 石 #56636B／縄文 土器 #B5532F／弥生 稲 #3C6E4F／坂 #7A5A3A／谷 水 #2F6F95 */
  :root{--base:#F4EEDF;--base2:#EAE2CC;--key:#1B4F66;--sub:#8A6A44;--ink:#1F2A2E;--ink2:#5A5F55;--line:#D8CDAF;
    --kyu:#56636B;--jo:#B5532F;--ya:#3C6E4F;--saka:#7A5A3A;--tani:#2F6F95;--gold:#E2C27A;
    --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--base2)}
  #map{position:absolute;inset:0}
  /* 下からせり上がるシート */
  .panel{position:absolute;left:10px;right:10px;bottom:10px;max-width:420px;background:rgba(244,238,223,.96);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(31,42,46,.22);overflow:hidden;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .panel header{padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .panel header .ttl{flex:1}
  .panel h1{font:700 18px/1.3 var(--serif);margin:0;letter-spacing:.04em;color:var(--key)}
  .panel .sub{font-size:12px;color:var(--ink2);margin:2px 0 0}
  #fold{flex:0 0 auto;min-height:32px;padding:2px 12px;font-size:12px}
  .body{max-height:62vh;overflow:auto;padding:4px 16px 12px}
  .panel.min .body{display:none}
  .panel.min header{border-bottom:0}
  section{padding:10px 0;border-bottom:1px dashed var(--line)}
  section:last-of-type{border-bottom:0}
  h2{font:700 13px/1.4 var(--serif);margin:0 0 6px;color:var(--sub);letter-spacing:.08em}
  .row{display:flex;align-items:center;gap:10px;margin:4px 0}
  .row input[type=range]{flex:1;height:32px;accent-color:var(--key)}
  .row output{flex:0 0 3.4em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--key)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
  button{font:inherit;font-size:13px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid #C9BD9C;
    background:#FFFCF4;color:var(--ink);cursor:pointer}
  button:active{transform:translateY(1px)}
  button.on{background:var(--key);border-color:var(--key);color:#fff}
  button.primary{background:var(--key);border-color:var(--key);color:#fff;font-weight:700}
  .seg{display:flex;border:1px solid #C9BD9C;border-radius:999px;overflow:hidden;width:max-content}
  .seg button{border:0;border-radius:0;min-height:36px;background:transparent}
  .seg button.on{background:var(--key);color:#fff}
  /* 「この場所」カード */
  .here{background:#FFFCF4;border:1px solid var(--line);border-left:4px solid var(--key);border-radius:10px;padding:8px 10px;margin:10px 0 4px}
  #readout{font-size:13px;margin:0}
  #readout b{color:var(--key)}
  #terrain{font-size:13px;margin:4px 0 0;line-height:1.6}
  #terrain b{font-family:var(--serif);color:var(--sub)}
  /* 地図に出すもの（凡例をかねたスイッチ） */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;min-height:38px;opacity:.45}
  .chip.on{opacity:1;background:#FFFCF4;color:var(--ink);border-color:#9C8F6C}
  .chip .mk{pointer-events:none}
  .note{font-size:11px;color:#6E6A58;margin:8px 0 0;line-height:1.5}
  details summary{cursor:pointer;font:700 13px/1.4 var(--serif);color:var(--sub);letter-spacing:.08em;padding:4px 0}
  /* しるし（ピン）：色だけでなく文字でも区別する */
  .mk{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:50%;color:#fff;border:2px solid #FFFAF0;box-shadow:0 1px 4px rgba(31,42,46,.4);cursor:pointer}
  .mk svg{width:17px;height:17px;display:block;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mk svg .f{fill:#fff;stroke:none}
  .mk .dots{position:absolute;right:-5px;bottom:-4px;display:flex;gap:1px}
  .mk .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #FFFAF0;display:block}
  .mk .dots i.kyu{background:var(--kyu)}.mk .dots i.jo{background:var(--jo)}.mk .dots i.ya{background:var(--ya)}
  .mk.kyu{background:var(--kyu);border-radius:7px}
  .mk.jo{background:var(--jo)}
  .mk.ya{background:var(--ya)}
  .mk.saka{background:var(--saka);border-radius:7px}
  .mk.tani{background:var(--tani);border-radius:7px}
  .mk.story{background:var(--key);border-color:var(--gold);width:32px;height:32px}
  .mk.start{background:var(--ink);border-color:var(--gold)}
  .mk.big{width:36px;height:36px;border:3px solid var(--gold)}
  .mk.big svg{width:21px;height:21px}
  .mk.hidden{display:none}
  /* 地図の上のしるしは地図ライブラリが位置を決めるので absolute に戻す（relative だとずれて動く） */
  .maplibregl-marker.mk{position:absolute}
  /* 吹き出し */
  .maplibregl-popup-content{font-size:13px;line-height:1.6;color:var(--ink);background:#FFFCF4;border-radius:12px;padding:0;
    box-shadow:0 6px 20px rgba(31,42,46,.25);overflow:hidden}
  .maplibregl-popup-close-button{font-size:20px;width:32px;height:32px;color:var(--ink2)}
  .pop{padding:10px 14px 12px;border-top:5px solid var(--key);max-height:58vh;overflow:auto}
  .pop.kyu{border-top-color:var(--kyu)}.pop.jo{border-top-color:var(--jo)}.pop.ya{border-top-color:var(--ya)}
  .pop.saka{border-top-color:var(--saka)}.pop.tani{border-top-color:var(--tani)}
  .pop .kind{font-size:11px;color:var(--ink2);letter-spacing:.08em}
  .pop h3{font:700 16px/1.4 var(--serif);margin:0 28px 4px 0}
  .pop h3 small{font:400 11px var(--serif);color:var(--ink2);margin-left:6px}
  .pop .meta{font-size:12px;color:var(--ink2)}
  .pop p{margin:6px 0 0}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 4px}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;color:#fff}
  .tag.旧{background:var(--kyu)}.tag.縄{background:var(--jo)}.tag.弥{background:var(--ya)}
  .sub2{font:700 12px/1.4 var(--serif);margin:10px 0 2px;color:var(--sub);letter-spacing:.06em}
  ul.life{margin:0;padding-left:1.1em;font-size:12.5px}
  ul.life li{margin:1px 0}
  a.walk{display:block;text-align:center;margin-top:10px;padding:9px 10px;border-radius:999px;background:var(--key);color:#fff;
    text-decoration:none;font-size:13px;font-weight:700}
  .src{font-size:10.5px;color:#7A7766;margin-top:8px;line-height:1.45}
  /* 近くのスポット */
  #near{max-height:30vh;overflow:auto;margin-top:6px}
  #near .item{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  #near .item .nm{flex:1}
  #near .item .ds{white-space:nowrap;color:var(--ink2);font-size:12px}
  #near .item .mk{cursor:inherit;flex:0 0 auto}
  #near .head{font-size:12px;color:var(--ink2);margin:2px 0}
  @media (min-width:700px){.panel{left:16px;bottom:16px;top:auto}.body{max-height:70vh}}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="panel">
  <header>
    <div class="ttl">
      <h1>縄文の海 3D地図</h1>
      <p class="sub">坂と谷をたどって、縄文の東京を歩く｜試作</p>
    </div>
    <button id="fold" aria-label="パネルをたたむ">たたむ</button>
  </header>
  <div class="body">
    <div class="here">
      <p id="readout">地図やしるしをタップすると、その場所の標高と地形（谷・坂・台地）の説明が出ます。</p>
      <p id="terrain"></p>
    </div>
    <section>
      <h2>海の高さ</h2>
      <div class="seg">
        <button id="now">今の海（0m）</button>
        <button id="jomon" class="on">縄文の海（目安 +4m）</button>
      </div>
      <div class="row">
        <input id="sea" type="range" min="0" max="10" step="0.5" value="4" aria-label="海面の高さ">
        <output id="seaOut">4m</output>
      </div>
    </section>
    <section>
      <h2>地図に出すもの</h2>
      <div class="chips">
        <button class="chip on" data-key="旧"><span class="mk kyu" data-icon="kyu"></span>旧石器</button>
        <button class="chip on" data-key="縄"><span class="mk jo" data-icon="jo"></span>縄文</button>
        <button class="chip on" data-key="弥"><span class="mk ya" data-icon="ya"></span>弥生</button>
        <button class="chip on" data-key="坂"><span class="mk saka" data-icon="saka"></span>坂の名前</button>
        <button class="chip on" data-key="谷"><span class="mk tani" data-icon="tani"></span>谷と川の跡</button>
      </div>
    </section>
    <section>
      <h2>歩く</h2>
      <div class="btns">
        <button id="nearBtn" class="primary">近くのスポット</button>
        <button id="viewBunkyo">文京区へ</button>
        <button id="viewTokyo">東京を広く</button>
      </div>
      <div id="near"></div>
    </section>
    <section>
      <details>
        <summary>表示の設定</summary>
        <div class="row">
          <label for="ex" style="font-size:13px">高さの強調</label>
          <input id="ex" type="range" min="1" max="6" step="0.5" value="3">
          <output id="exOut">3倍</output>
        </div>
      </details>
      <p class="note">色分けは「今の標高データで海面を上げた」推定です。下町は地盤沈下と盛土で、縄文時代の地面の高さと違います。遺跡は各区の遺跡一覧から。位置は丁目・番の代表点の目安で、遺跡の範囲そのものではありません。坂と谷の名前の由来は、坂の標識などに伝わる説で、諸説あります。地図・標高：国土地理院</p>
    </section>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
<script>
{
  // 国土地理院の標高タイル（PNG）を、MapLibreが読めるTerrarium形式に変換する
  const GSI = 'https://cyberjapandata.gsi.go.jp/xyz/';
  const flatTile = (() => { let c; return async () => {
    if (c) return c.slice(0);
    const cv = makeCanvas(256, 256), ctx = cv.getContext('2d');
    ctx.fillStyle = 'rgb(128,0,0)'; ctx.fillRect(0, 0, 256, 256); // 標高0m
    c = await toBuffer(cv); return c.slice(0);
  };})();

  function makeCanvas(w, h) {
    if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w, h);
    const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
  }
  async function toBuffer(cv) {
    const blob = cv.convertToBlob ? await cv.convertToBlob({type: 'image/png'})
      : await new Promise(r => cv.toBlob(r, 'image/png'));
    return await blob.arrayBuffer();
  }
  async function fetchPng(url, signal) {
    const res = await fetch(url, {signal});
    if (!res.ok) return null;
    return await createImageBitmap(await res.blob());
  }

  maplibregl.addProtocol('gsidem', async (params, abort) => {
    const [z, x, y] = params.url.replace('gsidem://', '').split('/').map(Number);
    let bmp = null;
    try {
      if (z >= 15) bmp = await fetchPng(`${GSI}dem5a_png/15/${x}/${y}.png`, abort.signal);
      else bmp = await fetchPng(`${GSI}dem_png/${z}/${x}/${y}.png`, abort.signal);
    } catch (e) { if (abort.signal.aborted) throw e; }
    if (!bmp) return {data: await flatTile()};

    const cv = makeCanvas(bmp.width, bmp.height), ctx = cv.getContext('2d');
    ctx.drawImage(bmp, 0, 0);
    const img = ctx.getImageData(0, 0, bmp.width, bmp.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] * 65536 + d[i + 1] * 256 + d[i + 2];
      let h;
      if (v === 8388608) h = 0;                 // データなし（海など）
      else if (v > 8388608) h = (v - 16777216) * 0.01;
      else h = v * 0.01;
      const t = h + 32768;
      d[i] = Math.floor(t / 256);
      d[i + 1] = Math.floor(t) % 256;
      d[i + 2] = Math.floor((t - Math.floor(t)) * 256);
      d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return {data: await toBuffer(cv)};
  });

  const demSource = () => ({type: 'raster-dem', tiles: ['gsidem://{z}/{x}/{y}'],
    tileSize: 256, maxzoom: 15, encoding: 'terrarium',
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'});

  // 海面の高さで色を変える（海＝青、陸＝標高ごとの土の色）
  function reliefColors(sea) {
    return ['interpolate', ['linear'], ['elevation'],
      -5, '#163f57',
      sea, '#4f8fb3',
      sea + 0.01, '#f1e8cc',
      sea + 6, '#dfcd9a',
      sea + 14, '#c4ab72',
      sea + 26, '#9a9a62',
      sea + 40, '#6c7a4c'];
  }

  let sea = 4, ex = 3;

  const map = new maplibregl.Map({
    container: 'map',
    center: [139.748, 35.722], zoom: 14.3, pitch: 62, bearing: -25, maxPitch: 85,
    style: {
      version: 8,
      sources: {
        pale: {type: 'raster', tiles: [GSI + 'pale/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 18,
          attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'},
        terrainSrc: demSource(),
        reliefSrc: demSource(),
        shadeSrc: demSource()
      },
      layers: [
        {id: 'bg', type: 'background', paint: {'background-color': '#eae2cc'}},
        {id: 'pale', type: 'raster', source: 'pale', paint: {'raster-opacity': 0.55}},
        {id: 'relief', type: 'color-relief', source: 'reliefSrc',
          paint: {'color-relief-opacity': 0.72, 'color-relief-color': reliefColors(sea)}},
        {id: 'shade', type: 'hillshade', source: 'shadeSrc',
          paint: {'hillshade-exaggeration': 0.6, 'hillshade-shadow-color': '#3b3424', 'hillshade-highlight-color': '#ffffff'}}
      ],
      terrain: {source: 'terrainSrc', exaggeration: ex}
    }
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'top-right');
  const geo = new maplibregl.GeolocateControl({positionOptions: {enableHighAccuracy: true}, trackUserLocation: true});
  map.addControl(geo, 'top-right');

  // スポット（位置は目安。説明は読書メモから。公開前に一次資料で確認）
  const spots = [
    {name: '千石', ll: [139.7440, 35.7275], start: true,
      text: 'スタート地点。本郷台の上。ここから坂を下ると谷へ入ります。'},
    {name: '白山神社', ll: [139.7517, 35.7225],
      text: '白山から千石方向へ続く谷（指ヶ谷・鶏声ヶ窪）のそば。', src: '『東京「スリバチ」地形散歩』本郷エリア'},
    {name: '小石川植物園', ll: [139.7473, 35.7177],
      text: '小石川の谷。千石の南を流れていた小石川は今は暗渠です。縄文の海がこの谷に入っていたかは標高で確かめます。', src: '『東京「スリバチ」地形散歩』コラム'},
    {name: '護国寺', ll: [139.7273, 35.7186],
      text: '境内が縄文の埋蔵文化財包蔵地。前の地下約25mからセイウチの頭骨が見つかっています。', src: '文京区遺跡一覧／貝塚爽平『東京の自然史』'},
    {name: '根津神社', ll: [139.7607, 35.7203],
      text: '本郷台の崖下。坂と崖下の世界の舞台。', src: '中沢新一『アースダイバー』第6章'},
    {name: '五条天神（上野）', ll: [139.7718, 35.7129],
      text: '上野台の岬のあたり。', src: '中沢新一『アースダイバー』第9章'}
  ];
  const $ = id => document.getElementById(id);
  // しるしと吹き出しの共通部品
  const allMarkers = [];
  const shown = new Set(['旧', '縄', '弥', '坂', '谷']);
  const ERA = {旧: '旧石器', 縄: '縄文', 弥: '弥生'};
  const ECLS = {旧: 'kyu', 縄: 'jo', 弥: 'ya'};
  const el$ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  function walkLink(ll) {
    const a = el$('a', 'walk', 'ここまで歩く（Googleマップ）');
    a.href = `https://www.google.com/maps/dir/?api=1&destination=${ll[1].toFixed(6)},${ll[0].toFixed(6)}&travelmode=walking`;
    a.target = '_blank'; a.rel = 'noopener'; return a;
  }
  // しるしの絵（白い線画）。旧石器＝尖頭器（石の槍先）、縄文＝縄文土器（炎のような口の深鉢）、弥生＝壺、
  // 坂＝斜面と石段、谷＝谷と流れ、物語＝渦巻き、スタート＝足あと
  const ICON = {
    kyu: '<path d="M12 2.5 17 11 12 21.5 7 11Z"/><path d="M12 6v12M9.5 9.5 12 11l2.5-1.5M9.5 13.5 12 15l2.5-1.5"/>',
    jo: '<path d="M5.5 8C6.5 4.5 8.5 4.5 9.5 7 10.5 3.5 13.5 3.5 14.5 7 15.5 4.5 17.5 4.5 18.5 8L16 20.5H8Z"/><path d="M7.5 12h9M8 15.5l2 1.5 2-1.5 2 1.5 2-1.5"/>',
    ya: '<path d="M9.5 3.5h5M10.5 3.5v2.5C6.5 8 5.5 11 6 14c.6 4 3.2 6.5 6 6.5s5.4-2.5 6-6.5c.5-3-.5-6-4.5-8V3.5"/><path d="M7 11.5h10"/>',
    saka: '<path class="f" d="M3 20 21 20 21 6Z" opacity=".35"/><path d="M3 20 21 6M8 16.1v-2.2M12.5 12.6v-2.2M17 9.1V6.9"/>',
    tani: '<path d="M2.5 5.5 9 15h6l6.5-9.5"/><path d="M7 19c1.7-1.4 3.3-1.4 5 0s3.3 1.4 5 0"/>',
    story: '<g transform="translate(12 12) scale(1.45) translate(-12.3 -12.6)" stroke-width="1.25"><path d="M12 12.2c.6 0 .9-.5.7-1-.3-.9-1.6-.9-2.2-.1-.8 1-.2 2.6 1.1 3 1.8.6 3.6-.7 3.6-2.6 0-2.4-2.4-4-4.7-3.4-2.9.7-4.2 4-2.8 6.6 1.6 3 5.6 3.9 8.4 2"/></g>',
    start: '<path class="f" d="M8.2 3.5c1.6 0 2.4 2 2.2 4.3l-.3 3.4H6.6l-.6-3C5.6 5.6 6.6 3.5 8.2 3.5ZM6.8 12.6h3.3l-.2 1.7c-.2 1.2-.9 1.9-1.6 1.9S7 15.5 6.9 14.3ZM15.8 8.3c1.6 0 2.6 2.1 2.2 4.3l-.6 3h-3.5l-.3-3.4c-.2-2.3.6-3.9 2.2-3.9ZM14 17h3.3l-.1 1.6c-.1 1.2-.8 1.9-1.6 1.9s-1.4-.7-1.6-1.9Z"/>'
  };
  const iconSvg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
  for (const m of document.querySelectorAll('[data-icon]')) m.innerHTML = iconSvg(m.dataset.icon);
  function addMarker({cls, icon, dots, ll, box, keys, name, type}) {
    const el = el$('div', 'mk ' + cls);
    el.innerHTML = iconSvg(icon) + (dots && dots.length ? '<span class="dots">' + dots.map(d => `<i class="${d}"></i>`).join('') + '</span>' : '');

  // 見つかった物・遺構から「ここでの暮らし」を言葉にする（一般的な考古学の解釈。遺跡ごとの断定ではない）
  const LIFE = [
    [/ナイフ形石器|尖頭器|細石刃|細石器|角錐状石器|台形様?石器|石器ブロック|礫群/, '旧石器時代の人が、石のナイフや槍で狩りをしていた（礫群は焼けた石で料理した跡と考えられています）'],
    [/住居/, '竪穴住居を建てて暮らしていた'],
    [/環濠/, 'ムラのまわりに堀をめぐらせていた（弥生時代の環濠集落）'],
    [/貝塚|貝層/, '海や干潟で貝をとって食べていた（貝塚は食べた貝の殻などを捨てた場所。近くまで海が来ていたしるし）'],

    [/石皿|磨石|凹石|敲石/, '石皿と磨石で、ドングリやクルミなどの木の実をすりつぶしていた'],
    [/土錘|石錘|土器片錘/, '網を使って魚をとっていた（網のおもり）'],
    [/土偶|土版/, '土偶などで祈りやまじないをしていた'],
    [/石棒|石剣/, '石棒を使ったまつりをしていた'],
    [/耳飾|玦状|勾玉|管玉|ガラス小玉|玉類|垂飾/, '耳飾りや玉で身を飾っていた'],

  function explainSite(s, eras) {
    const hay = `${s.k || ''}。${s.t || ''}`;
    const out = [];
    for (const [re, text] of LIFE) if (re.test(hay)) out.push(text);
    if (!out.length) {
      if (/集落/.test(hay)) out.push('ムラがあった場所');
      if (/包蔵地|散布地/.test(hay)) out.push('土器や石器が土の中に眠っている場所として登録されている（くわしい発掘はこれからの場所も多い）');
      if (eras.includes('縄')) out.push('縄文土器で煮炊きをしていた');
      if (eras.includes('弥')) out.push('弥生土器を使い、米づくりも始まっていた時代');
    }
    return out;
  }

  // 同じ場所に重なるしるしを少しずらす
  const used = {};
  const jitter = ll => { const key = ll.join(','); const i = used[key] = (used[key] || 0) + 1;
    return i > 1 ? [ll[0] + 0.00045 * Math.cos(i * 2.1), ll[1] + 0.00035 * Math.sin(i * 2.1)] : ll; };
  for (const s of sites) {
    const ll = jitter(s.ll || C[s.c]);
    const eras = [...s.e];
    const main = eras.includes('縄') ? '縄' : eras.includes('弥') ? '弥' : '旧';
    const box = el$('div', 'pop ' + ECLS[main]);
    box.appendChild(el$('div', 'kind', '遺跡'));
    box.appendChild(el$('h3', null, s.n));
    const tg = el$('div', 'tags');
    for (const e of eras) tg.appendChild(el$('span', 'tag ' + e, ERA[e]));
    box.append(tg, el$('div', 'meta', `${s.k}｜${s.a}`));
    if (s.t) box.appendChild(el$('p', null, s.t));
    const life = explainSite(s, eras);
    if (life.length) {
      box.appendChild(el$('div', 'sub2', 'ここでの暮らし（見つかった物からの推定）'));
      const ul = el$('ul', 'life'); for (const x of life) ul.appendChild(el$('li', null, x)); box.appendChild(ul);
    }
    box.appendChild(walkLink(ll));
    box.appendChild(el$('div', 'src', '出典：' + s.s + (s.c ? '。位置は丁目の代表点（目安）' : '')));
    addMarker({cls: ECLS[main] + (s.big ? ' big' : ''), icon: ECLS[main], dots: eras.filter(e => e !== main).map(e => ECLS[e]), ll, box, keys: eras, name: s.n, type: '遺跡'});
  }

  const slopeRecs = [];
  // 坂と谷（名前の由来と、地形の中での位置づけ）

    if (g.kind === '坂') slopeRecs.push({g, rec, walk, src, hl, ends: null});
  }

  function filterMarkers() {

  // 操作
  $('viewBunkyo').addEventListener('click', () => map.flyTo({center: [139.752, 35.716], zoom: 14.3, pitch: 62, bearing: -25}));

  const readout = $('readout');

  function showHeight(ll, label) {
    const raw = map.queryTerrainElevation(ll);
    if (raw == null) { readout.textContent = '標高を読み込み中です。少し待ってからもう一度どうぞ。'; return; }
    const h = raw / ex; // 返り値は強調の倍率がかかっているので戻す
    const diff = h - sea;
    readout.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = `${label}標高 約${h.toFixed(1)}m`;
    readout.appendChild(b);
    readout.appendChild(document.createTextNode(
      diff <= 0 ? `　→ 海面${sea}mのとき、ここは海の中（水深 約${(-diff).toFixed(1)}m）`
                : `　→ 海面${sea}mの海より 約${diff.toFixed(1)}m 高い陸`));
  }
  // 地形の読み取り：まわり（約100m・200m）の標高とくらべて、谷・坂・台地を判定する
  const elev = ll => { const r = map.queryTerrainElevation(ll); return r == null ? null : r / ex; };
  function describeTerrain(ll) {
    const box = $('terrain');
    const h0 = elev(ll);
    if (h0 == null) { box.textContent = ''; return; }
    const dLat = 0.0009, dLng = 0.0011; // 約100m
    const ring = r => { const out = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4;
      const v = elev({lng: ll.lng + Math.cos(a) * dLng * r, lat: ll.lat + Math.sin(a) * dLat * r}); if (v != null) out.push(v); } return out; };
    const r1 = ring(1), r2 = ring(2);
    if (r1.length < 6 || r2.length < 6) { box.textContent = ''; return; }
    const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
    const rel = h0 - mean(r2);           // まわり200mの平均との差
    const slope = (Math.max(...r1) - Math.min(...r1)) / 200 * 100; // 100m先どうしの差から見た勾配（%）
    let kind, text;
    if (h0 <= sea) {
      kind = '縄文の海の中';
      text = `海面${sea}mのとき、ここは海でした。今の地面は、そのあと川が運んだ土砂や人の埋め立てでできたところです。`;
    } else if (rel <= -3) {
      kind = '谷の底';
      text = `まわりより約${Math.round(-rel)}m低い谷です。台地を川が削ってできた谷で、谷底には川や湧き水が流れていました。今は暗渠（地下の水路）になっていることも多く、くねった道や「谷・窪・沢」の付く地名がそのしるしです。`;
      if (h0 - sea < 8) text += ` 海面からの高さは約${Math.round(h0 - sea)}mで、縄文の海が入り込んだ入り江の奥だったかもしれません。`;
    } else if (slope >= 5) {
      kind = '坂（台地と谷のあいだの斜面）';
      text = `100mで約${Math.round(slope)}mの高低差がある斜面です。台地の縁にあたり、崖の下からは湧き水が出ることがあります。縄文の人は、水が得やすく見晴らしのよい台地の縁に住むことが多かったといわれます。`;
    } else if (rel >= 3) {
      kind = '台地の高まり・尾根';
      text = `まわりより約${Math.round(rel)}m高いところです。谷にはさまれて突き出した台地の先なら、縄文の海に突き出た「岬」だった場所かもしれません。`;
    } else {
      kind = h0 - sea < 6 ? '低地（水辺に近い平地）' : '台地の上の平らなところ';
      text = h0 - sea < 6 ? '縄文の海に近い低い土地です。川の流れや海の砂が積もってできた平地です。'
        : '武蔵野台地の平らな面です。数万年前に川が運んだ砂利の上に、富士山や箱根の火山灰（関東ローム層）が積もってできています。';
    }
    box.innerHTML = '';
    const b = document.createElement('b'); b.textContent = '地形：' + kind; box.appendChild(b);
    box.appendChild(document.createElement('br'));
    box.appendChild(document.createTextNode(text + '（地形の判定は標高データからの自動の目安）'));
  }

  // 近くの遺跡（直線距離。歩く時間は道のりを直線の1.3倍、分速80mとした目安）
  let here = null;
  function distM(a, b) {
    const R = 6371000, toR = Math.PI / 180;
    const dLa = (b[1] - a[1]) * toR, dLo = (b[0] - a[0]) * toR;
    const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * toR) * Math.cos(b[1] * toR) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function showNear() {
    const base = here || map.getCenter().toArray();
    const list = allMarkers.filter(m => !m.keys || m.keys.some(k => shown.has(k)))
      .map(m => ({m, d: distM(base, m.ll)})).sort((a, b) => a.d - b.d).slice(0, 12);
    const box = $('near'); box.innerHTML = '';
    box.appendChild(el$('div', 'head', here ? '今いる場所から近い順' : '地図の中心から近い順（右上の現在地ボタンを押すと、今いる場所から）'));
    for (const {m, d} of list) {
      const it = el$('div', 'item');
      const min = Math.max(1, Math.round(d * 1.3 / 80));
      it.append((() => { const c = m.el.cloneNode(true); c.className = 'mk ' + m.cls.replace(' big', ''); c.removeAttribute('role'); return c; })(), el$('span', 'nm', m.name),
        el$('span', 'ds', (d < 1000 ? `${Math.round(d / 10) * 10}m` : `${(d / 1000).toFixed(1)}km`) + `・徒歩約${min}分`));
      it.addEventListener('click', () => { map.flyTo({center: m.ll, zoom: 16.2, pitch: 60}); if (!m.marker.getPopup().isOpen()) m.marker.togglePopup(); });
      box.appendChild(it);
    }
  }
  $('nearBtn').addEventListener('click', showNear);


  // OpenStreetMapの「名前の付いた坂の道」を読み込んで、坂を線で描き、しるしを坂の真ん中に移す。
  // 読めなかったときは番地の代表点（目安）のまま。読み込んだ線はこの端末に7日間とっておく。
  const OSM_KEY = 'jomon_osm_saka_v1';
  const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
  const OSM_Q = '[out:json][timeout:25];way["highway"]["name"~"坂|階段"](35.695,139.715,35.738,139.775);out tags geom;';
  async function loadOsmSaka() {
    try { const c = JSON.parse(localStorage.getItem(OSM_KEY) || 'null'); if (c && Date.now() - c.t < 7 * 864e5) return c.d; } catch (e) {}
    for (const url of OVERPASS) {
      try {
        const res = await fetch(url, {method: 'POST', body: 'data=' + encodeURIComponent(OSM_Q),
          headers: {'Content-Type': 'application/x-www-form-urlencoded'}});
        if (!res.ok) continue;
        const j = await res.json();
        const d = j.elements.filter(e => e.geometry).map(e => ({names: [e.tags.name, e.tags.alt_name, e.tags.old_name].filter(Boolean).join(';'),
          c: e.geometry.map(p => [+p.lon.toFixed(6), +p.lat.toFixed(6)])}));
        try { localStorage.setItem(OSM_KEY, JSON.stringify({t: Date.now(), d})); } catch (e) {}
        return d;
      } catch (e) {}
    }
    return null;
  }
  const lenOf = c => c.slice(1).reduce((s, p, i) => s + distM(c[i], p), 0);
  function midOf(c) {
    const half = lenOf(c) / 2; let acc = 0;
    for (let i = 1; i < c.length; i++) { const d = distM(c[i - 1], c[i]);
      if (acc + d >= half) { const t = d ? (half - acc) / d : 0; return [c[i - 1][0] + (c[i][0] - c[i - 1][0]) * t, c[i - 1][1] + (c[i][1] - c[i - 1][1]) * t]; }
      acc += d; }
    return c[0];
  }
  function applyOsm(ways) {
    const feats = [];
    for (const r of slopeRecs) {
      const base = r.g.n.replace(/（.*?）/g, '');
      // 同じ名前の坂はほかにもあるので、目安の位置から600m以内の道だけを使う
      const hit = ways.filter(w => w.names.split(';').some(x => x.replace(/\s/g, '') === base) && w.c.some(p => distM(p, r.g.ll) < 600));
      if (!hit.length) continue;
      const longest = hit.reduce((a, b) => lenOf(b.c) > lenOf(a.c) ? b : a);
      const mid = midOf(longest.c);
      // 坂の両はし：つないだ道の端点のうち、いちばん離れた2点
      const pts = hit.flatMap(w => [w.c[0], w.c[w.c.length - 1]]);
      let ends = [pts[0], pts[1]], best = -1;
      for (const a of pts) for (const b of pts) { const d = distM(a, b); if (d > best) { best = d; ends = [a, b]; } }
      r.ends = ends; r.len = Math.round(hit.reduce((s, w) => s + lenOf(w.c), 0));
      r.rec.ll = mid; r.rec.marker.setLngLat(mid);
      r.walk.href = `https://www.google.com/maps/dir/?api=1&destination=${mid[1].toFixed(6)},${mid[0].toFixed(6)}&travelmode=walking`;
      r.src.textContent = '出典：' + r.g.s + '。位置と線は OpenStreetMap の道（© OpenStreetMap contributors）';
      for (const w of hit) feats.push({type: 'Feature', properties: {name: r.g.n}, geometry: {type: 'LineString', coordinates: w.c}});
    }
    const data = {type: 'FeatureCollection', features: feats};
    if (map.getSource('saka')) { map.getSource('saka').setData(data); return feats.length; }
    map.addSource('saka', {type: 'geojson', data, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'});
    map.addLayer({id: 'saka-case', type: 'line', source: 'saka', layout: {'line-cap': 'round', 'line-join': 'round'},
      paint: {'line-color': '#FFFAF0', 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 3, 17, 10]}});
    map.addLayer({id: 'saka-line', type: 'line', source: 'saka', layout: {'line-cap': 'round', 'line-join': 'round'},
      paint: {'line-color': '#7A5A3A', 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 1.5, 17, 6]}});
    return feats.length;
  }
  function setSakaLines(on) { for (const id of ['saka-case', 'saka-line']) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
  // 坂のしるしを押したら、坂の上と下の標高を出す
  function sakaHeights(r) {
    if (!r.ends) { r.hl.textContent = ''; return; }
    const [a, b] = r.ends.map(p => elev({lng: p[0], lat: p[1]}));
    if (a == null || b == null) { r.hl.textContent = '坂の上と下の標高を読み込み中です。'; return; }
    const top = Math.max(a, b), low = Math.min(a, b);
    r.hl.textContent = `長さ 約${r.len}m｜坂の上 約${top.toFixed(1)}m → 坂の下 約${low.toFixed(1)}m（高低差 約${(top - low).toFixed(1)}m、標高データからの目安）`;
  }
  for (const r of slopeRecs) r.rec.el.addEventListener('click', () => sakaHeights(r));
  map.on('load', async () => {
    const ways = await loadOsmSaka();
    if (!ways) return;
    const n = applyOsm(ways);
    setSakaLines(shown.has('坂'));
    console.log('OpenStreetMapから坂の線', n, '本');
  });
  map.on('click', e => { showHeight(e.lngLat, 'この場所の'); describeTerrain(e.lngLat); });
  geo.on('geolocate', e => {
    here = [e.coords.longitude, e.coords.latitude];
    const ll = {lng: here[0], lat: here[1]};
    showHeight(ll, '今いる場所の'); describeTerrain(ll);
    if ($('near').childElementCount) showNear();
  });
  map.on('error', e => { if (e && e.error && /color-relief/.test(String(e.error.message))) readout.textContent = 'このブラウザでは色分けが表示できません。'; });
}
</script>

</html>
